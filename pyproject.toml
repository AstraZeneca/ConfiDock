[tool.poetry]
name = "confidock"
version = "0.6.0"
description = "DockQ-aware confidence prediction for antibody-antigen complexes: Boltz-2 confidence-head fine-tuning and a standalone DockQ-predictor GNN."
authors = ["AstraZeneca"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/AstraZeneca/ConfiDock"
repository = "https://github.com/AstraZeneca/ConfiDock"
keywords = ["antibody", "docking", "DockQ", "co-folding", "confidence-estimation", "protein-structure"]
packages = [{ include = "confidock" }]

[tool.poetry.dependencies]
# This version must also be changed in the ruff config.
python = ">=3.10,<3.13"
torch = "2.13.0"
# GNN layers/loaders for the DockQ predictor. The pure-python PyG core only;
# the compiled extras (pyg-lib, torch-cluster, torch-scatter) are not required.
torch-geometric = ">=2.5.0"
# Direct imports of the DockQ predictor's metric code (confidock/dockq_predictor/
# training/metrics.py): roc_auc_score from sklearn, the rank/distribution statistics from
# scipy. Both arrive transitively via boltz today; declared here so the metrics do not
# break on a boltz dependency change.
scikit-learn = ">=1.4.0"
scipy = ">=1.10.0"
boltz = ">=2.2.0"
pytorch-lightning = ">=2.0.0"
torchmetrics = ">=1.0.0"
hydra-core = ">=1.3.0"
omegaconf = ">=2.3.0"
biopython = ">=1.81"
gemmi = ">=0.6.0"

# Protenix has its own poetry files in /protenix-inference directory
ml-collections = ">=0.1.1"
optree = ">=0.13.0"
seaborn = "^0.13.2"

# For 3D structure visualization in notebooks
nglview = ">=3.0.6"
ipywidgets = ">=8.0.0"
jupyterlab = ">=3.0.0"
matplotlib = "^3.10.9"
numpy = ">=1.26,<2.2"
dockq = "^2.1.3"
tqdm = ">=4.42.1"

[tool.poetry.group.esm]
# Optional: only needed to generate decoys with ESMFold2. Every ``esm`` import in the
# codebase is function-local, so the rest of the package works without this group, and
# `poetry install` does not need to reach these git remotes. Enable with
# `poetry install --with esm` on Python 3.12.
optional = true

[tool.poetry.group.esm.dependencies]
# ESMFold2 currently requires Python 3.12.
esm = { git = "https://github.com/Biohub/esm.git", rev = "c94ed8d", markers = "python_version >= '3.12' and python_version < '3.13'" }
transformers = { git = "https://github.com/Biohub/transformers.git", rev = "3a8956fb4d4ea16b0ec8e71deef2c2909b6a5cbf", markers = "python_version >= '3.12' and python_version < '3.13'" }

[tool.poetry.group.dev.dependencies]
pre-commit = "*"
ruff = "^0.15.9"
black = "^25.1.0"
mypy = "^1.1.1"
ipykernel = "^7.2.0"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-reportlog = "*"
pytest-mock = "*"
coverage = ">=7.6.0"

[tool.poetry.group.docs.dependencies]
mkdocs = { version = "^1.3.0" }
mkdocs-material = { version = "^9.0.0" }
mkdocs-section-index = { version = "^0.3.4" }
pymdown-extensions = "^10.0.1"
mkdocstrings-python = "^1.10.7"
pytkdocs = { extras = ["numpy-style"], version = "^0.16.1" }

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

###################################
#
#              SETTINGS
#
###################################

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "--doctest-modules --cov=confidock --cov-report term-missing:skip-covered"
markers = [
    "slow: marks tests that require large models/checkpoints",
]
testpaths = [
    'tests',
]

[tool.coverage.run]
branch = true
relative_files = true
omit = [
    'docs/*',
]

[tool.coverage.report]
skip_covered = true
skip_empty = true
sort = 'Cover'

[tool.black]
line-length = 120

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "venv",
    "__init__.py",
    "setup.py",
]

# Builtins
builtins = ["__version__"]

# Same as Black.
line-length = 120

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.lint]
select = ["D", "E", "F", "W", "I001"]

ignore = []

fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Test functions document themselves through their names; requiring a docstring on
# every one of them adds noise without adding information.
per-file-ignores = { "tests/**" = ["D"] }

[tool.ruff.lint.pydocstyle]
# Always use numpy-style docstrings
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10
